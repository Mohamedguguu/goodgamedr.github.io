<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>wh-spam</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --muted: #6b6b6b;
      --accent: #5865f2;
      --green: #3ba55c;
      --red: #ed4245;
      --yellow: #faa61a;
      --input-bg: #1e1e1e;
      --mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      --sans: 'Segoe UI', system-ui, sans-serif;
    }
    [data-theme="light"] {
      --bg: #f0f0f0;
      --surface: #ffffff;
      --border: #d4d4d4;
      --text: #111111;
      --muted: #888888;
      --input-bg: #f8f8f8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      min-height: 100vh;
    }
    a { color: var(--accent); }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0;
    }
    header h1 span { color: var(--accent); }
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      display: inline-block;
    }
    .status-dot.running { background: var(--green); box-shadow: 0 0 4px var(--green); animation: pulse 1.2s infinite; }
    .status-dot.error { background: var(--red); }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }
    .status-label { font-family: var(--mono); font-size: 11px; color: var(--muted); }
    .theme-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-family: var(--mono);
    }
    .theme-btn:hover { border-color: var(--accent); color: var(--text); }
    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      height: calc(100vh - 46px);
    }
    .sidebar {
      overflow-y: auto;
      border-right: 1px solid var(--border);
      background: var(--surface);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .section-label {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .field { margin-bottom: 10px; }
    .field label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
      font-family: var(--mono);
    }
    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 7px 9px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 12px;
      font-family: var(--sans);
      outline: none;
      resize: vertical;
      transition: border-color .15s;
    }
    .field input:focus,
    .field textarea:focus { border-color: var(--accent); }
    .field input.ok { border-color: var(--green); }
    .field input.fail { border-color: var(--red); }
    .row { display: flex; gap: 8px; }
    .row .field { flex: 1; }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text);
      margin-bottom: 6px;
      cursor: pointer;
    }
    .checkbox-row input[type="checkbox"] {
      accent-color: var(--accent);
      width: 13px;
      height: 13px;
      cursor: pointer;
    }
    .drop-zone {
      border: 1px dashed var(--border);
      border-radius: 4px;
      padding: 12px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      background: var(--input-bg);
      transition: border-color .15s;
      font-family: var(--mono);
      position: relative;
    }
    .drop-zone:hover, .drop-zone.over { border-color: var(--accent); color: var(--text); }
    .drop-zone img {
      max-height: 80px;
      max-width: 100%;
      display: block;
      margin: 6px auto 0;
      border-radius: 3px;
    }
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .slider-wrap input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .slider-val {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      min-width: 52px;
      text-align: right;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 7px 14px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 12px;
      font-family: var(--mono);
      cursor: pointer;
      transition: background .12s, border-color .12s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--border); }
    .btn:disabled { opacity: .4; pointer-events: none; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { filter: brightness(1.1); }
    .btn.danger { border-color: var(--red); color: var(--red); }
    .btn.danger:hover { background: var(--red); color: #fff; }
    .btn.success { border-color: var(--green); color: var(--green); }
    .btn.success:hover { background: var(--green); color: #fff; }
    .btn.sm { padding: 4px 10px; font-size: 11px; }
    .right-col {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .tab {
      padding: 10px 16px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color .12s;
      user-select: none;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-content { display: none; flex: 1; overflow: hidden; }
    .tab-content.active { display: flex; flex-direction: column; }
    pre#preview {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.7;
      color: #cdd9e5;
      background: #0d0d0d;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
    }
    [data-theme="light"] pre#preview { background: #1e1e1e; }
    #console-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .console-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .console-stats {
      display: flex;
      gap: 16px;
      font-family: var(--mono);
      font-size: 11px;
    }
    .stat { color: var(--muted); }
    .stat span { color: var(--text); }
    .stat.ok span { color: var(--green); }
    .stat.err span { color: var(--red); }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      font-family: var(--mono);
      font-size: 11.5px;
      line-height: 1.8;
      background: var(--bg);
    }
    .log-entry { display: flex; gap: 8px; }
    .log-ts { color: var(--muted); flex-shrink: 0; }
    .log-msg.ok { color: var(--green); }
    .log-msg.err { color: var(--red); }
    .log-msg.warn { color: var(--yellow); }
    .log-msg.info { color: var(--text); }
    .configs-tab {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: var(--bg);
    }
    .cfg-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .cfg-name {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 260px;
    }
    .cfg-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .empty-state {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      padding: 24px;
      text-align: center;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 10px 14px;
      font-family: var(--mono);
      font-size: 12px;
      border-radius: 4px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s;
      z-index: 999;
      pointer-events: none;
      max-width: 280px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.err { border-left-color: var(--red); }
    .toast.ok { border-left-color: var(--green); }
    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; height: auto; }
      .right-col { height: 400px; }
      .sidebar { height: auto; }
    }
  </style>
</head>
<body>
<header>
  <h1><span>//</span> wh-spam <span style="color:var(--muted);font-weight:400;">v2</span></h1>
  <div class="header-right">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-label" id="statusLabel">idle</span>
    <button class="theme-btn" onclick="toggleTheme()">theme</button>
  </div>
</header>

<div class="layout">
  <div class="sidebar">
    <div>
      <div class="section-label">Webhook</div>
      <div class="field">
        <label>url</label>
        <input id="webhookUrl" placeholder="https://discord.com/api/webhooks/..." spellcheck="false" />
      </div>
      <div class="row">
        <div class="field">
          <label>username override</label>
          <input id="webhookName" placeholder="optional" />
        </div>
        <div class="field">
          <label>avatar url</label>
          <input id="avatarUrl" placeholder="https://..." />
        </div>
      </div>
      <div class="field">
        <label>avatar drag & drop</label>
        <div class="drop-zone" id="avatarZone">drop image here</div>
        <input type="file" id="avatarInput" accept="image/*" style="display:none" />
      </div>
    </div>

    <div>
      <div class="section-label">Message</div>
      <div class="field">
        <label>content</label>
        <textarea id="message" rows="3" placeholder="message content..."></textarea>
      </div>
      <div class="field">
        <label>file attachment</label>
        <div class="drop-zone" id="dropZone">drop file here</div>
        <input type="file" id="fileInput" style="display:none" />
      </div>
    </div>

    <div>
      <div class="section-label">Embed</div>
      <div class="field">
        <label>title</label>
        <input id="embedTitle" />
      </div>
      <div class="field">
        <label>description</label>
        <textarea id="embedDesc" rows="2"></textarea>
      </div>
      <div class="row">
        <div class="field">
          <label>color (hex)</label>
          <input id="embedColor" placeholder="#5865f2" />
        </div>
        <div class="field">
          <label>image url</label>
          <input id="embedImageUrl" placeholder="https://..." />
        </div>
      </div>
      <div class="field">
        <label>embed image drop</label>
        <div class="drop-zone" id="embedZone">drop image here</div>
        <input type="file" id="embedInput" accept="image/*" style="display:none" />
      </div>
    </div>

    <div>
      <div class="section-label">Options</div>
      <label class="checkbox-row"><input type="checkbox" id="useEmoji" checked /> append random emoji</label>
      <label class="checkbox-row"><input type="checkbox" id="useNumber" checked /> append random number</label>
      <label class="checkbox-row"><input type="checkbox" id="showTimestamp" /> append timestamp</label>
      <div class="field" style="margin-top:8px;">
        <label>emoji list (comma separated)</label>
        <input id="emojiList" value="🔥,💣,⚡,🚀,🎯" />
      </div>
      <div class="field">
        <label>interval <span class="slider-val" id="speedValue">1000ms</span></label>
        <div class="slider-wrap">
          <input id="speed" type="range" min="100" max="3000" step="100" value="1000" />
        </div>
      </div>
      <div class="field">
        <label>retry delay (ms)</label>
        <input id="retryDelay" type="number" min="100" step="100" value="5000" style="width:120px;" />
      </div>
    </div>

    <div>
      <div class="section-label">Controls</div>
      <div class="btn-group">
        <button class="btn success" id="startBtn" onclick="startSpam()">▶ start</button>
        <button class="btn danger" id="stopBtn" onclick="stopSpam()" disabled>■ stop</button>
        <button class="btn" id="checkBtn" onclick="checkWebhook()">validate</button>
      </div>
      <div class="btn-group" style="margin-top:6px;">
        <button class="btn sm" onclick="saveConfig()">save cfg</button>
        <button class="btn sm" onclick="loadLastConfig()">load last</button>
        <button class="btn sm" onclick="clearFields()">clear fields</button>
      </div>
    </div>
  </div>

  <div class="right-col">
    <div class="tabs">
      <div class="tab active" data-tab="log">console</div>
      <div class="tab" data-tab="preview">payload</div>
      <div class="tab" data-tab="configs">saved configs</div>
    </div>

    <div class="tab-content active" id="tab-log">
      <div id="console-wrap">
        <div class="console-toolbar">
          <div class="console-stats">
            <div class="stat ok">sent <span id="statSent">0</span></div>
            <div class="stat err">errors <span id="statErr">0</span></div>
            <div class="stat">rate limited <span id="statRL">0</span></div>
          </div>
          <button class="btn sm" onclick="clearLog()">clear</button>
        </div>
        <div id="log"></div>
      </div>
    </div>

    <div class="tab-content" id="tab-preview">
      <pre id="preview">// payload will appear here</pre>
    </div>

    <div class="tab-content" id="tab-configs">
      <div class="configs-tab" id="cfgList"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let avatarFile = null, droppedFile = null, embedFile = null;
  let intervalId = null;
  let sent = 0, errors = 0, ratelimited = 0;
  const SK = 'wh-spam-configs';

  function toggleTheme() {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  }

  function toast(msg, type = 'info') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show ' + type;
    clearTimeout(el._t);
    el._t = setTimeout(() => el.className = 'toast', 2500);
  }

  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab, .tab-content').forEach(e => e.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('tab-' + t.dataset.tab).classList.add('active');
    });
  });

  function setupDrop(zoneId, inputId, onFile) {
    const zone = document.getElementById(zoneId);
    const inp = document.getElementById(inputId);
    zone.addEventListener('click', () => inp.click());
    inp.addEventListener('change', e => handle(e.target.files[0]));
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('over'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('over');
      handle(e.dataTransfer.files[0]);
    });
    function handle(f) {
      if (!f) return;
      onFile(f);
      if (f.type.startsWith('image/')) {
        const r = new FileReader();
        r.onload = () => zone.innerHTML = `<img src="${r.result}" /><br><span style="font-size:10px;color:var(--muted)">${f.name}</span>`;
        r.readAsDataURL(f);
      } else {
        zone.textContent = f.name;
      }
    }
  }

  setupDrop('avatarZone', 'avatarInput', f => avatarFile = f);
  setupDrop('dropZone', 'fileInput', f => droppedFile = f);
  setupDrop('embedZone', 'embedInput', f => embedFile = f);

  document.getElementById('speed').addEventListener('input', e => {
    document.getElementById('speedValue').textContent = e.target.value + 'ms';
  });

  function getConfig() {
    return {
      url: document.getElementById('webhookUrl').value.trim(),
      name: document.getElementById('webhookName').value.trim(),
      base: document.getElementById('message').value,
      avatarUrl: document.getElementById('avatarUrl').value.trim(),
      emojis: document.getElementById('useEmoji').checked,
      numbers: document.getElementById('useNumber').checked,
      timestamp: document.getElementById('showTimestamp').checked,
      speed: +document.getElementById('speed').value,
      retryDelay: +document.getElementById('retryDelay').value,
      emojiList: document.getElementById('emojiList').value.split(',').map(s => s.trim()).filter(Boolean),
      embed: {
        title: document.getElementById('embedTitle').value,
        description: document.getElementById('embedDesc').value,
        color: document.getElementById('embedColor').value.trim(),
        imageUrl: document.getElementById('embedImageUrl').value.trim()
      }
    };
  }

  function buildPayload(cfg) {
    const extras = [];
    if (cfg.emojis && cfg.emojiList.length) extras.push(cfg.emojiList[Math.floor(Math.random() * cfg.emojiList.length)]);
    if (cfg.numbers) extras.push(Math.floor(Math.random() * 90000 + 10000));
    if (cfg.timestamp) extras.push(new Date().toLocaleTimeString());
    const content = cfg.base + (extras.length ? ' ' + extras.join(' ') : '');
    const p = { content };
    if (cfg.name) p.username = cfg.name;
    if (!avatarFile && cfg.avatarUrl) p.avatar_url = cfg.avatarUrl;
    const e = cfg.embed;
    if (e.title || e.description || embedFile || e.imageUrl) {
      const em = {};
      if (e.title) em.title = e.title;
      if (e.description) em.description = e.description;
      if (e.color) em.color = parseInt(e.color.replace('#', ''), 16);
      if (embedFile) em.image = { url: 'attachment://' + embedFile.name };
      else if (e.imageUrl) em.image = { url: e.imageUrl };
      p.embeds = [em];
    }
    document.getElementById('preview').textContent = JSON.stringify(p, null, 2);
    return p;
  }

  async function sendOnce() {
    const cfg = getConfig();
    if (!cfg.url || !cfg.base) return;
    const payload = buildPayload(cfg);
    const form = new FormData();
    if (avatarFile) form.append('file', avatarFile, avatarFile.name);
    if (embedFile) form.append('file2', embedFile, embedFile.name);
    if (droppedFile) form.append('file3', droppedFile, droppedFile.name);
    form.append('payload_json', JSON.stringify(payload));
    try {
      const res = await fetch(cfg.url, { method: 'POST', body: form });
      if (res.ok || res.status === 204) {
        sent++;
        document.getElementById('statSent').textContent = sent;
        log(`#${sent} sent`, 'ok');
      } else if (res.status === 429) {
        ratelimited++;
        document.getElementById('statRL').textContent = ratelimited;
        log(`rate limited — retrying in ${cfg.retryDelay}ms`, 'warn');
        stopSpam();
        setTimeout(startSpam, cfg.retryDelay);
      } else {
        errors++;
        document.getElementById('statErr').textContent = errors;
        log(`http ${res.status}`, 'err');
      }
    } catch {
      errors++;
      document.getElementById('statErr').textContent = errors;
      log('network error', 'err');
      stopSpam();
    }
  }

  function startSpam() {
    if (intervalId) return;
    const cfg = getConfig();
    if (!cfg.url) { toast('enter a webhook url', 'err'); return; }
    if (!cfg.base) { toast('enter a message', 'err'); return; }
    sent = 0; errors = 0; ratelimited = 0;
    document.getElementById('statSent').textContent = 0;
    document.getElementById('statErr').textContent = 0;
    document.getElementById('statRL').textContent = 0;
    setStatus('running');
    log('started', 'info');
    sendOnce();
    intervalId = setInterval(sendOnce, cfg.speed);
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
  }

  function stopSpam() {
    clearInterval(intervalId);
    intervalId = null;
    setStatus('idle');
    log('stopped', 'info');
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
  }

  function setStatus(s) {
    const dot = document.getElementById('statusDot');
    const lbl = document.getElementById('statusLabel');
    dot.className = 'status-dot ' + (s === 'running' ? 'running' : s === 'error' ? 'error' : '');
    lbl.textContent = s;
  }

  function log(msg, type = 'info') {
    const wrap = document.getElementById('log');
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    const ts = document.createElement('span');
    ts.className = 'log-ts';
    ts.textContent = new Date().toLocaleTimeString('en-GB');
    const m = document.createElement('span');
    m.className = 'log-msg ' + type;
    m.textContent = msg;
    entry.appendChild(ts);
    entry.appendChild(m);
    wrap.appendChild(entry);
    wrap.scrollTop = wrap.scrollHeight;
  }

  function clearLog() {
    document.getElementById('log').innerHTML = '';
    sent = 0; errors = 0; ratelimited = 0;
    document.getElementById('statSent').textContent = 0;
    document.getElementById('statErr').textContent = 0;
    document.getElementById('statRL').textContent = 0;
  }

  function checkWebhook() {
    const inp = document.getElementById('webhookUrl');
    const url = inp.value.trim();
    if (!url) { toast('no url', 'err'); return; }
    inp.className = '';
    log('validating...', 'info');
    fetch(url).then(r => {
      if (r.ok || r.status === 204) {
        inp.classList.add('ok');
        log('webhook valid', 'ok');
        toast('valid', 'ok');
      } else {
        inp.classList.add('fail');
        log(`invalid: ${r.status}`, 'err');
        toast(`invalid: ${r.status}`, 'err');
      }
    }).catch(() => {
      inp.classList.add('fail');
      log('network error during validate', 'err');
      toast('network error', 'err');
    });
  }

  function clearFields() {
    ['webhookUrl','webhookName','avatarUrl','message','embedTitle','embedDesc','embedColor','embedImageUrl'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('retryDelay').value = '5000';
    avatarFile = droppedFile = embedFile = null;
    document.getElementById('avatarZone').textContent = 'drop image here';
    document.getElementById('dropZone').textContent = 'drop file here';
    document.getElementById('embedZone').textContent = 'drop image here';
    document.getElementById('useEmoji').checked = true;
    document.getElementById('useNumber').checked = true;
    document.getElementById('showTimestamp').checked = false;
    document.getElementById('preview').textContent = '// payload will appear here';
    toast('cleared');
  }

  function saveConfig() {
    const cfg = getConfig();
    if (!cfg.url) { toast('no url to save', 'err'); return; }
    const list = JSON.parse(localStorage.getItem(SK) || '[]');
    list.push({ ...cfg, _saved: Date.now() });
    localStorage.setItem(SK, JSON.stringify(list));
    renderConfigs();
    toast('config saved', 'ok');
  }

  function loadLastConfig() {
    const list = JSON.parse(localStorage.getItem(SK) || '[]');
    if (!list.length) { toast('no saved configs', 'err'); return; }
    applyConfig(list[list.length - 1]);
    toast('loaded', 'ok');
  }

  function applyConfig(cfg) {
    const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };
    set('webhookUrl', cfg.url);
    set('webhookName', cfg.name);
    set('avatarUrl', cfg.avatarUrl);
    set('message', cfg.base);
    set('embedTitle', cfg.embed?.title);
    set('embedDesc', cfg.embed?.description);
    set('embedColor', cfg.embed?.color);
    set('embedImageUrl', cfg.embed?.imageUrl);
    set('emojiList', cfg.emojiList?.join(','));
    set('speed', cfg.speed);
    set('retryDelay', cfg.retryDelay);
    document.getElementById('speedValue').textContent = (cfg.speed || 1000) + 'ms';
    document.getElementById('useEmoji').checked = !!cfg.emojis;
    document.getElementById('useNumber').checked = !!cfg.numbers;
    document.getElementById('showTimestamp').checked = !!cfg.timestamp;
  }

  function deleteConfig(i) {
    const list = JSON.parse(localStorage.getItem(SK) || '[]');
    list.splice(i, 1);
    localStorage.setItem(SK, JSON.stringify(list));
    renderConfigs();
    toast('deleted');
  }

  function renderConfigs() {
    const list = JSON.parse(localStorage.getItem(SK) || '[]');
    const el = document.getElementById('cfgList');
    if (!list.length) {
      el.innerHTML = '<div class="empty-state">no saved configs</div>';
      return;
    }
    el.innerHTML = '';
    list.forEach((cfg, i) => {
      const item = document.createElement('div');
      item.className = 'cfg-item';
      const name = document.createElement('div');
      name.className = 'cfg-name';
      name.textContent = cfg.name || cfg.url;
      const actions = document.createElement('div');
      actions.className = 'cfg-actions';
      const load = document.createElement('button');
      load.className = 'btn sm';
      load.textContent = 'load';
      load.onclick = () => { applyConfig(cfg); toast('loaded', 'ok'); };
      const del = document.createElement('button');
      del.className = 'btn sm danger';
      del.textContent = 'del';
      del.onclick = () => deleteConfig(i);
      actions.appendChild(load);
      actions.appendChild(del);
      item.appendChild(name);
      item.appendChild(actions);
      el.appendChild(item);
    });
  }

  renderConfigs();
</script>
</body>
</html>
